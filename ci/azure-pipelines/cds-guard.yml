# cds-guard step template for Azure Pipelines.
#
# Copy this file into your repository (for example to pipelines/cds-guard.yml) and use it in the
# pipeline that runs as build validation on your main branch:
#
#   trigger: none
#   pr: none              # Azure Repos starts PR builds through the build validation policy
#   pool:
#     vmImage: ubuntu-latest
#   steps:
#     - template: pipelines/cds-guard.yml
#
# Then add the pipeline as a required "Build validation" policy on main, and run
# "npx @cbs-consulting/cds-guard codeowners --platform azure --write" and the script it writes to
# create the reviewer policies. Run both again whenever approvers change.
parameters:
  - name: root
    type: string
    default: .
  - name: version
    type: string
    default: "0"
  - name: nodeVersion
    type: string
    default: "22.x"

steps:
  - task: UseNode@1
    inputs:
      version: ${{ parameters.nodeVersion }}
  - script: |
      if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
    workingDirectory: ${{ parameters.root }}
    displayName: Install project dependencies
  # --format azure marks each finding on its file and line. In pull request builds, --base shows
  # how each changed item looked on the target branch.
  - script: |
      BASE="$SYSTEM_PULLREQUEST_TARGETBRANCH"
      npx --yes @cbs-consulting/cds-guard@${{ parameters.version }} check --root "${{ parameters.root }}" --format azure --junit "$(Agent.TempDirectory)/cds-guard.xml" ${BASE:+--base "$BASE"}
    displayName: cds-guard check
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Agent.TempDirectory)/cds-guard.xml
      testRunTitle: cds-guard
      failTaskOnMissingResultsFile: false
